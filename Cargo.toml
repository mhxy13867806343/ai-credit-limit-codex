[package]
name = "codex-monitor"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight macOS menu bar monitor for OpenAI Codex usage"

[dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSMenu",
    "NSMenuItem",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTextField",
    "NSView",
    "NSWindow",
    "NSScrollView",
    "NSClipView",
    "NSScroller",
] }
objc2-foundation = { version = "0.3", features = [
    "NSDate",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSThread",
    "NSTimer",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3.1"
libc = "0.2"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1
panic = "abort"
strip = true        # Strip symbols to minimize binary size
